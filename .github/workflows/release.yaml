name: Changesets
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm Trusted Publishing: npm exchanges this job's OIDC token for a short-lived publish
      # credential. The trusted publisher (inaridiy/webforai, release.yaml) is configured on
      # npmjs.com; no NPM_TOKEN secret is used.
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "SKIP_SIMPLE_GIT_HOOKS=1" >> $GITHUB_ENV
      # Trusted publishing needs npm >= 11.5.1; Node 24 bundles npm 11.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          version: 9.1.4
          run_install: true
      # changesets/action v1 (v2 requires Changesets CLI v3). With no NPM_TOKEN in the
      # environment and OIDC available, it leaves .npmrc alone and npm uses trusted publishing.
      - name: create and publish versions
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          publish: pnpm ci:publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
