<svg xmlns="http://www.w3.org/2000/svg" width="928" height="318" viewBox="0 0 928 318" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif'>
<title id="t">webforai compared with other HTML-to-Markdown pipelines</title>
<desc id="d">webforai: F1 0.877, loses half the content on 5.1% of pages, keeps 98.1% of code blocks; Trafilatura: F1 0.860, loses half the content on 10.2% of pages, keeps 40.5% of code blocks; Defuddle: F1 0.855, loses half the content on 11.5% of pages, keeps 89.7% of code blocks; Readability + Turndown: F1 0.831, loses half the content on 12.6% of pages, keeps 45.2% of code blocks</desc>
